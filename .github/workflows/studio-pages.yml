name: Deploy Interactive Studio to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["studio/**", ".github/workflows/studio-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript and assets
        run: |
          node --check studio/app.js
          test -s studio/index.html
          test -s studio/style.css
          node studio/test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
