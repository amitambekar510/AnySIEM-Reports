# The menu the AI shows users. To add a template, create templates/<id>/ and
# add one entry here. See docs/ADDING_A_TEMPLATE.md.
catalog_version: 3
templates:
  - id: soc-monthly-report
    name: "SOC Operations Report"
    description: "Periodic SOC operations and compliance report: platform health, alerts, incidents, detection coverage, SLAs, and framework summary. Monthly, quarterly, or annual."
    path: templates/soc-monthly-report
    category: "Operations"
    palette: deep-winter-blue
    related: [executive-ciso-brief, efficiency-report, sla-compliance-report]
    status: available
  - id: executive-ciso-brief
    name: "Executive / CISO Brief"
    description: "One-to-two page leadership brief: posture, key events, risk, and decisions needed."
    path: templates/executive-ciso-brief
    category: "Operations"
    palette: nordic-charcoal
    status: available
  - id: efficiency-report
    name: "SOC Efficiency Report"
    description: "Detection and response timing, alert quality, workload, automation impact, and quality assurance."
    path: templates/efficiency-report
    category: "Operations"
    palette: ember-amber
    status: available
  - id: daily-soc-summary
    name: "Daily SOC Summary and Shift Handover"
    description: "Short per-day or per-shift report with alert activity, exceptions, open items, and a formal handover."
    path: templates/daily-soc-summary
    category: "Operations"
    palette: fern-violet
    status: available
  - id: weekly-soc-summary
    name: "Weekly SOC Summary"
    description: "Weekly view of alerts, incidents, threat activity, platform health, and improvements."
    path: templates/weekly-soc-summary
    category: "Operations"
    palette: copper-indigo
    status: available
  - id: incident-report
    name: "Security Incident Report"
    description: "Per-incident report with classification, timeline, root cause analysis, impact, regulatory notification record, and recommendations."
    path: templates/incident-report
    category: "Incident"
    palette: deep-cranberry
    related: [post-incident-review, regulatory-notification-report]
    status: available
  - id: post-incident-review
    name: "Post-Incident Review"
    description: "Blameless review of an incident: what worked, what did not, lessons, and tracked actions."
    path: templates/post-incident-review
    category: "Incident"
    palette: crimson-jade
    related: [incident-report]
    status: available
  - id: regulatory-notification-report
    name: "Regulatory Notification Report"
    description: "Record of reportability decisions, obligations, notification content, submission, and follow-up."
    path: templates/regulatory-notification-report
    category: "Incident"
    palette: emerald-ruby
    related: [incident-report]
    status: available
  - id: phishing-campaign-analysis
    name: "Phishing Campaign Analysis"
    description: "Analysis of a phishing campaign: lure, indicators, impact, response, and control gaps."
    path: templates/phishing-campaign-analysis
    category: "Incident"
    palette: ultramarine-mustard
    related: [phishing-simulation-awareness-report]
    status: available
  - id: insider-threat-case-report
    name: "Insider Threat and User Behavior Case Report"
    description: "Restricted case report on suspicious user activity with authorization, facts, assessment, and referrals."
    path: templates/insider-threat-case-report
    category: "Incident"
    palette: saffron-azure
    status: available
  - id: alert-incident-tracker
    name: "Daily Alert and Incident Tracker"
    description: "Field definitions, values, and log layout for a daily or monthly alert and incident tracker."
    path: templates/alert-incident-tracker
    category: "Incident"
    palette: fuchsia-shamrock
    status: available
  - id: threat-intelligence-digest
    name: "Threat Intelligence Digest"
